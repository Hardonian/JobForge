name: Security Baseline
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '21 5 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
